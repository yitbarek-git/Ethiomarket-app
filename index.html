<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>EthioMarket - Ethiopian Online Marketplace</title>
    <meta name="description" content="An Ethiopian online marketplace connecting local vendors and buyers across Ethiopia with native payments and multilingual support in Amharic, Oromifa, Tigrinya, and Somali." />
    <meta name="keywords" content="EthioMarket, Ethiopia marketplace, buy sell Ethiopia, Addis Ababa shopping, Telebirr payment, Chapa payments, Habesha Kemis, Ethiopian coffee, Yirgacheffe, Sidama, electronics Bole, used cars Ethiopia, teff grain, Merkato online, Ethiopian e-commerce" />

    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    <meta name="theme-color" content="#f59e0b" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ethiomarket.et" />
    <meta property="og:site_name" content="EthioMarket" />
    <meta property="og:title" content="EthioMarket - Ethiopian Online Marketplace" />
    <meta property="og:description" content="An Ethiopian online marketplace connecting local vendors and buyers across Ethiopia with native payments and multilingual support in Amharic, Oromifa, Tigrinya, and Somali." />

    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
    <link rel="dns-prefetch" href="https://images.unsplash.com" />

    <!-- Schema.org JSON-LD structured data for search engines -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "@id": "https://ethiomarket.et/#website",
          "url": "https://ethiomarket.et",
          "name": "EthioMarket",
          "description": "Ethiopia's leading digital marketplace connecting buyers and vendors nationwide with Telebirr and Chapa payments.",
          "inLanguage": ["en", "am", "om", "ti", "so"],
          "potentialAction": {
            "@type": "SearchAction",
            "target": "https://ethiomarket.et/marketplace?q={search_term_string}",
            "query-input": "required name=search_term_string"
          }
        },
        {
          "@type": "Organization",
          "@id": "https://ethiomarket.et/#organization",
          "name": "EthioMarket",
          "url": "https://ethiomarket.et",
          "logo": "https://images.unsplash.com/photo-1617627143750-d86bc21e42bb?w=500&auto=format&fit=crop&q=80",
          "address": {
            "@type": "PostalAddress",
            "streetAddress": "Bole Road, Near Medhanialem Mall",
            "addressLocality": "Addis Ababa",
            "addressRegion": "Addis Ababa",
            "addressCountry": "ET"
          },
          "contactPoint": {
            "@type": "ContactPoint",
            "telephone": "+251-911-000000",
            "contactType": "Customer Support",
            "areaServed": "ET",
            "availableLanguage": ["English", "Amharic", "Oromo", "Tigrinya", "Somali"]
          }
        }
      ]
    }
    </script>
